services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: noshowhq
      POSTGRES_PASSWORD: noshowhq
      POSTGRES_DB: noshowhq
    ports:
      - "5433:5432"
    volumes:
      - noshowhq_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noshowhq -d noshowhq"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  noshowhq_pgdata:
